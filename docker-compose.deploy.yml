name: ola-ai-data-agent

services:
  backend:
    image: ${ECR_REGISTRY}/ola-ai-data-agent-backend:${IMAGE_TAG}
    environment:
      ENABLE_LIVE_AGENTS: "false"
      RUN_HISTORY_DB_PATH: /app/app_data/run_history.sqlite3
    expose:
      - "8000"
    volumes:
      - app_data:/app/app_data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - app_net

  frontend:
    image: ${ECR_REGISTRY}/ola-ai-data-agent-frontend:${IMAGE_TAG}
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app_net

volumes:
  app_data:

networks:
  app_net:
    driver: bridge
