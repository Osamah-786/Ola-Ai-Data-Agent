[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ola-agentic-ai-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.2",
    "langchain>=1.4.6",
    "langchain-core",
    "langchain-groq>=1.1.3",
    "langgraph",
    "pydantic>=2.12.5",
    "pandas",
    "requests",
    "python-dotenv",
    "groq",
    "psycopg2-binary",
    "pyarrow",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
namespaces = true
include = ["app", "app.api", "app.core", "app.models", "app.services", "agents", "models", "utils"]
exclude = [
    "frontend",
    "frontend.*",
    "data",
    "data.*",
    "tests",
    "tests.*",
    "venv",
    "venv.*",
    ".venv",
    ".venv.*",
    "build",
    "build.*",
    "dist",
    "dist.*",
    "__pycache__",
    "__pycache__.*",
    ".pytest_cache",
    ".pytest_cache.*",
    "*.egg-info",
    "*.egg-info.*",
]
